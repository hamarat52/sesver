# SesVer Windows kurulum programını (Inno Setup) gerçek Windows'ta derler,
# sessiz kurulum/kaldırma ile duman testi yapar ve .exe'yi artifact olarak yükler.
# v* tag'i push edilince (ör. v1.2.3) test geçtikten sonra .exe'yi GitHub
# Releases'a yayınlar (release job'u). Tag dışı koşularda yalnız dry-run logu basılır.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Kurulum programı sürümü (ör. 1.0.0; boş = kökteki VERSION)"
        required: false
        default: ""
      full_launch_test:
        description: "Tam test: sihirbaz ilk kurulumu (/VERYSILENT /ORTAMKUR; torch vb. indirme, konsol penceresi gözlemi) + kısayoldan 127.0.0.1 HTTP 200 (uzun sürer)"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - "ci/windows-installer*"
    # Tag push'larında paths filtresi uygulanmaz (GitHub davranışı): her v* tag'i derlenir.
    tags:
      - "v*"
    paths:
      - "windows/**"
      - ".github/workflows/windows-installer.yml"
      - "*.py"
      - "WINDOWS_BASLAT.bat"
      - "requirements.txt"
      - "kilit/**"
      - "VERSION"
      - "engines/**"
      - "voices/hazir/**"
      - "tools/mikrofon_duman.py"
      - "locales/**"

permissions:
  contents: read

# Üçüncü taraf action'lar etiket (@v7) yerine 40 karakterlik commit SHA'sına sabittir; yanındaki
# yorum o commit'in sürüm etiketidir. Etiket sonradan başka commit'e taşınsa da burada çalışan
# kod değişmez (release job'u contents: write taşır). Güncellerken: git ls-remote --tags
# https://github.com/actions/<ad> ile yeni etiketin commit'ini bulup SHA'yı ve yorumu birlikte
# değiştirin; tests/test_ci_workflow.py biçimi denetler.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.surum.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sürümü belirle (tag == VERSION → girdi → VERSION)
        id: surum
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Tek kaynak: kökteki VERSION (surum.py ve windows\SesVer.iss de bunu okur).
          if (-not (Test-Path 'VERSION')) { Write-Host "::error::Kökte VERSION dosyası yok."; exit 1 }
          $dosya = (Get-Content 'VERSION' -Raw -Encoding utf8).Trim([char]0xFEFF).Trim()
          if ($env:REF_TYPE -eq 'tag') {
            $kaynak = "tag $env:REF_NAME"
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              Write-Host "::error::Geçersiz tag biçimi: '$env:REF_NAME'. Beklenen: vMAJOR.MINOR.PATCH (ör. v1.2.3). 'v1.2', 'v1.2.3-beta' gibi biçimler kabul edilmez."
              exit 1
            }
            $ver = $Matches[1]
            if ($ver -ne $dosya) {
              Write-Host "::error::Tag ($env:REF_NAME) ile VERSION dosyası ('$dosya') uyuşmuyor. VERSION'ı $ver yapıp commit'leyin, tag'i o commit'e koyun."
              exit 1
            }
          } elseif ($env:INPUT_VERSION) {
            $kaynak = 'workflow_dispatch girdisi'
            $ver = $env:INPUT_VERSION.Trim()
            if ($ver -ne $dosya) { Write-Host "::warning::Girdi sürümü ($ver) VERSION ($dosya) ile farklı; yalnız deneme derlemesi için kullanın." }
          } else {
            $kaynak = 'VERSION dosyası'
            $ver = $dosya
          }
          # Windows sürüm kaynağı (VERSIONINFO) her parça için 0..65535 kabul eder.
          if ($ver -notmatch '^\d+\.\d+\.\d+$' -or ($ver.Split('.') | Where-Object { [int64]$_ -gt 65535 })) {
            Write-Host "::error::Geçersiz sürüm: '$ver' ($kaynak). Beklenen: MAJOR.MINOR.PATCH, her parça 0-65535 (ör. 1.2.3)."
            exit 1
          }
          Write-Host "Sürüm: $ver (kaynak: $kaynak)"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Inno Setup kur (chocolatey)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup başarısız: $LASTEXITCODE" }
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe bulunamadı" }
          Write-Host "ISCC: $($iscc.FullName)"
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Kurulum programını derle
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" "windows\SesVer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC derleme hatası: $LASTEXITCODE" }
          $exe = "windows\Output\SesVer-Kurulum-$env:APP_VERSION.exe"
          if (-not (Test-Path $exe)) { throw "Beklenen çıktı yok: $exe" }
          $f = Get-Item $exe
          $boy = $f.Length
          Write-Host ("Üretildi: {0} ({1:N0} bayt)" -f $f.FullName, $f.Length)
          # SignPath ön koşulu: ürün adı ve ürün sürümü her derlemede SesVer ve VERSION olmalı.
          # Inno Setup sürüm dizgilerini yükleyicideki sabit uzunluklu boşluk yer tutucularının
          # üstüne yazar ve kalan boşlukları dosyada bırakır (issrc Projects/Res/SetupLdr.version.rc,
          # Compiler.ExeUpdateFunc.pas UpdateStringValue): ProductName = 'SesVer' + 54 boşluk.
          # İmzadan önce kaynakta kırpılır; araç önce ham değerleri yazar (kök neden kanıtı).
          # Dosya boyu ve gömülü kurulum verisi değişmez; ayrıntı: tools/pe_surum_bilgisi.py.
          $py = Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
                Where-Object { $_.Source -notlike '*\WindowsApps\*' } | Select-Object -First 1
          if (-not $py) { throw 'python bulunamadı (sürüm bilgisini kırpmak için gerekli)' }
          Write-Host "Python: $($py.Source) $((& $py.Source --version) -join ' ')"
          $env:PYTHONIOENCODING = 'utf-8'; [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          & $py.Source tools\pe_surum_bilgisi.py --kirp $exe
          if ($LASTEXITCODE -ne 0) { throw "Sürüm bilgisi kırpılamadı: $LASTEXITCODE" }
          $f = Get-Item $exe
          if ($f.Length -ne $boy) { throw "Kırpma dosya boyunu değiştirdi: $boy -> $($f.Length)" }
          $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($f.FullName)
          Write-Host "Dosya özellikleri: ProductName='$($vi.ProductName)' ProductVersion='$($vi.ProductVersion)' FileVersion='$($vi.FileVersion)' CompanyName='$($vi.CompanyName)' FileDescription='$($vi.FileDescription)' LegalCopyright='$($vi.LegalCopyright)' OriginalFilename='$($vi.OriginalFilename)'"
          $beklenen = [ordered]@{
            ProductName    = 'SesVer'
            ProductVersion = $env:APP_VERSION
            FileVersion    = $env:APP_VERSION
            CompanyName    = 'HamaratLabs'
            LegalCopyright = 'Muhammed Yusuf Hamarat - Founder of HamaratLabs'
          }
          foreach ($k in $beklenen.Keys) {
            $v = $vi.$k
            if ($v -cne $beklenen[$k]) { throw "$k '$($beklenen[$k])' olmalı: '$v' (uzunluk $(if ($null -ne $v) { $v.Length } else { 'yok' }))" }
          }
          foreach ($k in 'Comments', 'FileDescription', 'OriginalFilename') {
            $v = $vi.$k
            if ($v -and $v -cne $v.Trim()) { throw "$k baştaki/sondaki boşluk içeriyor: '$v'" }
          }
          Write-Host "Dosya özellikleri BAŞARILI: ProductName='$($vi.ProductName)' ProductVersion='$($vi.ProductVersion)' FileVersion='$($vi.FileVersion)' CompanyName='$($vi.CompanyName)' LegalCopyright='$($vi.LegalCopyright)'; sürüm kaynağında sondaki boşluk yok, dosya boyu değişmedi."
          Get-FileHash -Algorithm SHA256 $exe | Format-List
          "INSTALLER=$($f.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Duman testi — sessiz kurulum, kısayollar, kısayoldan açılış, kaldırma
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SesVer'
          $log = Join-Path $env:RUNNER_TEMP 'sesver-kurulum.log'
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon',"/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Kurulum çıkış kodu: $($p.ExitCode)" }

          $beklenen = @('app.py','desktop.py','hata_rehberi.py','i18n.py','voice_library.py','voice_designer.py',
                        'surum.py','guncelleme.py','VERSION',
                        'voice_design_map.json','requirements.txt','WINDOWS_BASLAT.bat','LICENSE',
                        'README.md','AI_KURULUM.md','SesVer.ico','voices\hazir\belgesel\ses.json','voices\hazir\masalci\ref.wav',
                        'locales\en.json','locales\ar.json','locales\ja.json',
                        'kilit\pip.txt','kilit\voxcpm.txt','kilit\torch-pypi.txt','kilit\torch-cu130.txt','kilit\windows-x64-py311.txt',
                        'engines\__init__.py','engines\base.py','engines\ema.py','engines\srt.py')
          foreach ($b in $beklenen) {
            if (-not (Test-Path (Join-Path $app $b))) { throw "Kurulumda eksik: $b" }
          }
          $kaynakPy = (Get-ChildItem -Path . -Filter *.py -File).Count
          $kurulanPy = (Get-ChildItem -Path $app -Filter *.py -File).Count
          Write-Host "Kökteki .py: $kaynakPy, kurulan .py: $kurulanPy"
          if ($kaynakPy -ne $kurulanPy) { throw ".py sayısı tutmuyor" }
          if (-not (Test-Path (Join-Path $app 'voices\seslerim'))) { throw 'voices\seslerim oluşturulmadı' }

          # Kaldır/Ekle (Ayarlar → Uygulamalar) kaydı: AppId {12D750B7-...} → ..._is1 anahtarı.
          $unKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{12D750B7-D7C7-400A-A81A-2A083B04A266}_is1'
          if (-not (Test-Path $unKey)) { throw "Kaldır/Ekle kaydı yok: $unKey" }
          $un = Get-ItemProperty -Path $unKey
          Write-Host "Kaldır/Ekle: DisplayName=$($un.DisplayName) DisplayVersion=$($un.DisplayVersion) Publisher=$($un.Publisher) InstallLocation=$($un.InstallLocation) DisplayIcon=$($un.DisplayIcon)"
          if ($un.DisplayName -ne 'SesVer') { throw "Kaldır/Ekle DisplayName 'SesVer' olmalı: $($un.DisplayName)" }
          if ($un.DisplayVersion -ne $env:APP_VERSION) { throw "Kaldır/Ekle DisplayVersion $env:APP_VERSION olmalı: $($un.DisplayVersion)" }
          if ($un.InstallLocation.TrimEnd('\') -ne $app) { throw "Kaldır/Ekle InstallLocation $app olmalı: $($un.InstallLocation)" }
          if (-not $un.UninstallString) { throw 'Kaldır/Ekle UninstallString boş' }

          # Ortam henüz kurulmadı (python-embed yok) → kısayollar WINDOWS_BASLAT.bat'ı göstermeli.
          $sh = New-Object -ComObject WScript.Shell
          $baslat = Join-Path ([Environment]::GetFolderPath('Programs')) 'SesVer.lnk'
          $masa = Join-Path ([Environment]::GetFolderPath('Desktop')) 'SesVer.lnk'
          $baslatBeklenen = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\SesVer.lnk'
          if ($baslat -ne $baslatBeklenen) { throw "Başlat Menüsü yolu beklenenden farklı: $baslat (beklenen $baslatBeklenen)" }
          foreach ($l in @($baslat, $masa)) {
            if (-not (Test-Path $l)) { throw "Kısayol yok: $l" }
            $t = $sh.CreateShortcut($l)
            Write-Host "$l -> $($t.TargetPath) $($t.Arguments) [$($t.WorkingDirectory)] ikon=$($t.IconLocation)"
            if ($t.IconLocation -notlike '*\SesVer.ico*') { throw "Kısayol ikonu SesVer.ico olmalı: $($t.IconLocation)" }
            if ($t.IconLocation -ne "$app\SesVer.ico,0") { throw "Kısayol ikonu kurulum klasöründeki SesVer.ico olmalı: $($t.IconLocation)" }
            if ($t.TargetPath -notlike '*\WINDOWS_BASLAT.bat') { throw "İlk kurulumda kısayol .bat'ı göstermeli: $($t.TargetPath)" }
            if ($t.TargetPath -ne "$app\WINDOWS_BASLAT.bat") { throw "Kısayol hedefi kurulum klasöründe olmalı: $($t.TargetPath)" }
            if ($t.WorkingDirectory -ne $app) { throw "Kısayol çalışma klasörü $app olmalı: $($t.WorkingDirectory)" }
          }
          if (-not (Test-Path (Join-Path $app 'SesVer.ico'))) { throw 'Kısayolun gösterdiği SesVer.ico dosyası yok' }

          # --- Kısayoldan açılış: Başlat Menüsü kısayolunun hedefi + argümanları gerçekten çalıştırılır.
          # Ölçüt (CI süresine sığan, dürüst): başlatıcı açılır, taşınabilir Python'u indirip
          # SHA256 doğrular ve çıkarır, Python çalışır ve pip ile ilk kurulum adımı başlar.
          # torch vb. paket kurulumu ve pencere açılışı burada beklenmez (bkz. full-launch job'u).
          Write-Host '::group::Kısayoldan açılış (Başlat Menüsü kısayolu)'
          $t = $sh.CreateShortcut($baslat)
          $acOut = Join-Path $env:RUNNER_TEMP 'sesver-kisayol-acilis.out.log'
          $acErr = Join-Path $env:RUNNER_TEMP 'sesver-kisayol-acilis.err.log'
          $sp = @{ FilePath = $t.TargetPath; WorkingDirectory = $t.WorkingDirectory; PassThru = $true
                   RedirectStandardOutput = $acOut; RedirectStandardError = $acErr }
          if ($t.Arguments) { $sp.ArgumentList = $t.Arguments }
          Write-Host "Çalıştırılıyor: $($t.TargetPath) $($t.Arguments) (çalışma klasörü: $($t.WorkingDirectory))"
          $bp = Start-Process @sp
          $sinir = (Get-Date).AddMinutes(12)
          $basladi = $false
          while ((Get-Date) -lt $sinir) {
            Start-Sleep -Seconds 5
            $c = Get-Content $acOut -Raw -ErrorAction SilentlyContinue
            if ($c -match 'Ilk kurulum yapiliyor') { $basladi = $true; break }
            if ($bp.HasExited) { break }
          }
          $bitti = $bp.HasExited
          if (-not $bitti) { & taskkill.exe /PID $bp.Id /T /F | Out-Host }
          Start-Sleep -Seconds 3
          $c = Get-Content $acOut -Raw -ErrorAction SilentlyContinue
          Write-Host "----- başlatıcı konsol çıktısı (stdout) -----"; Write-Host $c
          Write-Host "----- başlatıcı stderr (son 15 satır) -----"; Get-Content $acErr -Tail 15 -ErrorAction SilentlyContinue | Out-Host
          if ($bitti) { throw "Başlatıcı ilk kurulum adımına gelmeden çıktı (çıkış kodu $($bp.ExitCode))" }
          if (-not $basladi) { throw 'Başlatıcı 12 dk içinde ilk kurulum (pip) adımına gelmedi' }
          foreach ($m in @('[SesVer baslatici calisiyor]','Indiriliyor: cpython-3.11.','Python hazir.','Ilk kurulum yapiliyor')) {
            if (-not $c.Contains($m)) { throw "Başlatıcı çıktısında beklenen satır yok: $m" }
          }
          $embedPy = Join-Path $app 'python-embed\python.exe'
          if (-not (Test-Path $embedPy)) { throw "python-embed\python.exe oluşmadı" }
          $pyv = (& $embedPy --version) -join ' '
          Write-Host "Kurulum klasöründeki python-embed: $pyv"
          if ($pyv -notmatch '^Python 3\.11\.') { throw "python-embed Python 3.11 değil: $pyv" }
          if (Test-Path (Join-Path $app 'python-embed\sesver_kurulum_tamam.txt')) { throw 'Kurulum tamam işareti beklenmedik şekilde yazıldı (pip yarıda kesildi)' }
          Write-Host 'Kısayoldan açılış KANITLANDI: kısayol hedefi çalıştı, Python indirildi+doğrulandı+çalıştı, pip ilk kurulum adımı başladı. (torch kurulumu ve pencere açılışı bu job''da test edilmez.)'

          # --- Yalnız-kurulum kipi (kurulum sihirbazının kullandığı akış) + iptal yolu.
          # Sessiz kurulum /ORTAMKUR'suz olduğu için ilk kurulumu ATLAMIŞ olmalı (eski davranış).
          if (-not (Select-String -Path $log -Pattern '/ORTAMKUR verilmedi' -SimpleMatch -Quiet)) { throw 'Sessiz kurulum ilk kurulumu atladığını günlüğe yazmadı' }
          # python-embed yukarıdaki adımdan hazır → bat pip adımına hızla gelir. Sihirbazın
          # izlediği her şey sınanır: durum satırı biçimi, kurulum_log.txt, kurulum_pid.txt
          # (cmd.exe PID'i) ve "Kurulumu durdur" = taskkill /T /F /PID → süreç ağacı biter,
          # kurulum tamam işareti yazılmaz (sonraki açılışta kaldığı yerden devam).
          Write-Host '::group::Yalnız-kurulum kipi (sihirbaz akışı) + iptal'
          $durum = Join-Path $app 'kurulum_durum.txt'; $ykLog = Join-Path $app 'kurulum_log.txt'; $pidD = Join-Path $app 'kurulum_pid.txt'
          Remove-Item $durum, $ykLog, $pidD -Force -ErrorAction SilentlyContinue
          $yk = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/d', '/c', 'call', "`"$app\WINDOWS_BASLAT.bat`"", '/yalniz-kurulum' -WorkingDirectory $app -WindowStyle Hidden -PassThru
          $gorulen = @(); $sinir = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $sinir) {
            Start-Sleep -Milliseconds 500
            $s = Get-Content $durum -TotalCount 1 -ErrorAction SilentlyContinue
            if ($s -and ($gorulen.Count -eq 0 -or $gorulen[-1] -ne $s)) { $gorulen += $s; Write-Host "durum: $s" }
            if ($s -match '\|(tamam|hata:)') { break }
            if ($s -match '^[2-6]/6\|' -and (Test-Path $pidD)) { break }
            if ($yk.HasExited) { break }
          }
          foreach ($g in $gorulen) { if ($g -notmatch '^\d+/6\|[\x20-\x7e]+$') { throw "Durum satırı biçim dışı: '$g'" } }
          if (-not (Test-Path $ykLog)) { throw 'kurulum_log.txt oluşmadı' }
          if (-not ($gorulen | Where-Object { $_ -match '^[2-6]/6\|' -and $_ -notmatch '\|hata:' })) {
            Get-Content $ykLog -Tail 40 | Out-Host
            throw "Yalnız-kurulum kipi pip adımına gelmedi: $($gorulen -join ' ; ')"
          }
          $ykPid = [int]((Get-Content $pidD -TotalCount 1).Trim())
          $pc = Get-CimInstance Win32_Process -Filter "ProcessId=$ykPid"
          Write-Host "kurulum_pid.txt: $ykPid -> $($pc.Name) $($pc.CommandLine)"
          if (-not $pc -or $pc.Name -ne 'cmd.exe' -or $pc.CommandLine -notlike '*yalniz-kurulum*') { throw "kurulum_pid.txt yalnız-kurulum cmd.exe'sini göstermiyor ($ykPid)" }
          # Sihirbazdaki "Kurulumu durdur" ile aynı komut:
          & taskkill.exe /T /F /PID $ykPid | Out-Host
          Start-Sleep -Seconds 3
          if (Get-CimInstance Win32_Process -Filter "ProcessId=$ykPid") { throw 'İptalden sonra yalnız-kurulum cmd.exe hâlâ çalışıyor' }
          $kalan = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($app, [StringComparison]::OrdinalIgnoreCase) }
          if ($kalan) { throw "İptalden sonra SesVer klasöründen süreç kaldı: $(($kalan | ForEach-Object Name) -join ',')" }
          if (Test-Path (Join-Path $app 'python-embed\sesver_kurulum_tamam.txt')) { throw 'İptal edilen kurulum tamam işareti yazmış' }
          $ykIcerik = Get-Content $ykLog -Raw
          foreach ($m in @('[SesVer baslatici calisiyor]', '[BILGI] Yalniz kurulum kipi', '[DURUM] ')) { if (-not $ykIcerik.Contains($m)) { throw "kurulum_log.txt'de beklenen satır yok: $m" } }
          if ($ykIcerik.Contains('SesVer aciliyor')) { throw 'Yalnız-kurulum kipi SesVer''i başlatmaya çalıştı' }
          Write-Host '----- kurulum_log.txt (son 15 satır) -----'; Get-Content $ykLog -Tail 15 | Out-Host
          $global:LASTEXITCODE = 0
          Write-Host 'Yalnız-kurulum kipi KANITLANDI: durum satırları biçimde, günlük yazıldı, PID yalnız-kurulum cmd.exe''si, taskkill /T ile süreç ağacı bitti, tamam işareti yazılmadı.'
          Write-Host '::endgroup::'
          # Sonraki adımlar için temiz duruma dön (yarım kalan python-embed ve geçici dosyalar).
          for ($i = 0; $i -lt 10; $i++) {
            Remove-Item (Join-Path $app 'python-embed'), (Join-Path $app 'pbs_tmp') -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem $app -Filter 'pbs_*' -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path (Join-Path $app 'python-embed'))) { break }
            Start-Sleep -Seconds 2
          }
          if (Test-Path (Join-Path $app 'python-embed')) { throw 'Yarım python-embed temizlenemedi' }
          $global:LASTEXITCODE = 0
          Write-Host '::endgroup::'

          # Ortam hazırmış gibi yap (python-embed + kurulum işareti), yeniden kur →
          # WebView2 varsa kısayollar doğrudan pythonw.exe desktop.py olmalı.
          New-Item -ItemType Directory -Force (Join-Path $app 'python-embed') | Out-Null
          Copy-Item "$env:SystemRoot\System32\cmd.exe" (Join-Path $app 'python-embed\pythonw.exe')
          Set-Content (Join-Path $app 'python-embed\sesver_kurulum_tamam.txt') 'ok'
          # Kullanıcı verisi kaldırmadan sağ çıkmalı:
          Set-Content (Join-Path $app 'voices\seslerim\kisisel.txt') 'kullanici verisi'
          New-Item -ItemType Directory -Force (Join-Path $app 'outputs') | Out-Null
          Set-Content (Join-Path $app 'outputs\uretim.wav') 'x'

          $wv = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') |
                ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          Write-Host "WebView2 Runtime: $(if ($wv) { $wv } else { 'YOK' })"

          $log2 = Join-Path $env:RUNNER_TEMP 'sesver-kurulum2.log'
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon',"/LOG=$log2" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Yeniden kurulum çıkış kodu: $($p.ExitCode)" }
          foreach ($l in @($baslat, $masa)) {
            $t = $sh.CreateShortcut($l)
            Write-Host "$l -> $($t.TargetPath) $($t.Arguments) [$($t.WorkingDirectory)] ikon=$($t.IconLocation)"
            if ($t.IconLocation -notlike '*\SesVer.ico*') { throw "Kısayol ikonu SesVer.ico olmalı: $($t.IconLocation)" }
            if ($t.WorkingDirectory -ne $app) { throw "Kısayol çalışma klasörü $app olmalı: $($t.WorkingDirectory)" }
            if ($wv) {
              if ($t.TargetPath -notlike '*\python-embed\pythonw.exe') { throw "Ortam hazırken kısayol pythonw.exe olmalı: $($t.TargetPath)" }
              if ($t.Arguments -notlike '*desktop.py*') { throw "Kısayol argümanı desktop.py içermeli: $($t.Arguments)" }
            } else {
              if ($t.TargetPath -notlike '*\WINDOWS_BASLAT.bat') { throw "WebView2 yokken kısayol .bat olmalı: $($t.TargetPath)" }
            }
          }

          # Sessiz kaldırma
          $un = Join-Path $app 'unins000.exe'
          if (-not (Test-Path $un)) { throw 'unins000.exe yok' }
          $p = Start-Process -FilePath $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Kaldırma çıkış kodu: $($p.ExitCode)" }
          # Kaldırıcı kendini kopyadan çalıştırır; dosyaların silinmesini bekle. python-embed\ artık
          # [UninstallDelete]'te değil, kaldırıcının son adımında (usPostUninstall) silinir: onu da bekle.
          for ($i = 0; $i -lt 60 -and ((Test-Path (Join-Path $app 'app.py')) -or (Test-Path (Join-Path $app 'python-embed'))); $i++) { Start-Sleep -Seconds 1 }
          foreach ($g in @('app.py','desktop.py','WINDOWS_BASLAT.bat','python-embed','voices\hazir')) {
            if (Test-Path (Join-Path $app $g)) { throw "Kaldırmadan sonra kaldı: $g" }
          }
          foreach ($l in @($baslat, $masa)) { if (Test-Path $l) { throw "Kaldırmadan sonra kısayol kaldı: $l" } }
          for ($i = 0; $i -lt 15 -and (Test-Path $unKey); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $unKey) { throw "Kaldırmadan sonra Kaldır/Ekle kaydı kaldı: $unKey" }
          foreach ($k in @('voices\seslerim\kisisel.txt','outputs\uretim.wav')) {
            if (-not (Test-Path (Join-Path $app $k))) { throw "Kullanıcı verisi silindi: $k" }
          }
          Write-Host 'Duman testi BAŞARILI: kurulum, Kaldır/Ekle kaydı, kısayollar (hedef/çalışma klasörü/ikon), kısayoldan açılış (başlatıcı + Python + pip başlangıcı), kısayol seçimi, kaldırma ve kullanıcı verisinin korunması doğrulandı.'

      # 1.4.1: kaldırırken indirilen bileşenleri (python-embed\, .venv\) saklama. Sessiz kaldırmada
      # varsayılan silmedir (eski davranış, yukarıdaki duman testi bunu da sınar); /BILESENLERISAKLA
      # ile kalır ve aynı yere yeniden kurulum onları (kurulum işareti dahil) olduğu gibi kullanır.
      # Ortam burada taklittir (CI süresi); gerçek paketlerle "yeniden inmedi" ölçümü full-launch'ta.
      - name: Kaldırma testi — sakla seçeneği (/BILESENLERISAKLA), yeniden kurulum, varsayılan silme
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SesVer'
          $unKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{12D750B7-D7C7-400A-A81A-2A083B04A266}_is1'
          $pe = Join-Path $app 'python-embed'
          $venv = Join-Path $app '.venv'
          function Kur([string]$ad) {
            $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon',"/LOG=$(Join-Path $env:RUNNER_TEMP "sesver-kurulum-$ad.log")" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "[$ad] kurulum çıkış kodu: $($p.ExitCode)" }
          }
          function Kaldir([string]$ad, [string[]]$ek) {
            $kl = Join-Path $env:RUNNER_TEMP "sesver-kaldir-$ad.log"
            $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList (@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$kl") + $ek) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "[$ad] kaldırma çıkış kodu: $($p.ExitCode)" }
            # Kaldırıcı kendini kopyadan çalıştırır: dosyalar, kayıt ve günlükteki son karar satırı beklenir.
            for ($i = 0; $i -lt 90; $i++) {
              $karar = Select-String -Path $kl -Pattern 'Kaldirma: indirilen bilesenler (saklandi|siliniyor)' -ErrorAction SilentlyContinue
              if (-not (Test-Path (Join-Path $app 'app.py')) -and -not (Test-Path $unKey) -and $karar) { break }
              Start-Sleep -Seconds 1
            }
            Start-Sleep -Seconds 3
            if (Test-Path (Join-Path $app 'app.py')) { throw "[$ad] kaldırmadan sonra app.py kaldı" }
            if (Test-Path $unKey) { throw "[$ad] kaldırmadan sonra Kaldır/Ekle kaydı kaldı" }
            Write-Host "[$ad] kaldırma günlüğü (karar satırı): $((Select-String -Path $kl -Pattern 'Kaldirma: ' | ForEach-Object Line) -join ' | ')"
            return $kl
          }
          function Ortam-Izi {
            Get-ChildItem $pe, $venv -Recurse -File -Force -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.FullName.Substring($app.Length))|$($_.Length)|$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Sort-Object
          }

          Kur 'sakla-1'
          # Kurulmuş bir ortam taklidi: python-embed (pythonw + işaret + büyük paket dosyası) ve .venv.
          New-Item -ItemType Directory -Force (Join-Path $pe 'Lib\site-packages\ornekpaket'), (Join-Path $venv 'Scripts') | Out-Null
          Copy-Item "$env:SystemRoot\System32\cmd.exe" (Join-Path $pe 'pythonw.exe')
          Copy-Item "$env:SystemRoot\System32\cmd.exe" (Join-Path $pe 'python.exe')
          Set-Content (Join-Path $pe 'sesver_kurulum_tamam.txt') 'kilit_sha256=ci-taklit voxcpm=2.0.3'
          $buyuk = New-Object byte[] (8MB); (New-Object Random 141).NextBytes($buyuk)
          [IO.File]::WriteAllBytes((Join-Path $pe 'Lib\site-packages\ornekpaket\agirlik.bin'), $buyuk)
          Set-Content (Join-Path $venv 'pyvenv.cfg') 'home = C:\taklit'
          $once = Ortam-Izi
          Write-Host "Taklit ortam: $($once.Count) dosya"

          # 1) Sessiz kaldırma + /BILESENLERISAKLA: python-embed ve .venv aynen kalır, SesVer dosyaları gider.
          $kl = Kaldir 'sakla' @('/BILESENLERISAKLA')
          if (-not (Select-String -Path $kl -Pattern 'Kaldirma: indirilen bilesenler saklandi' -Quiet)) { throw 'Kaldırma günlüğünde "saklandi" kararı yok' }
          $sonra = Ortam-Izi
          if (Compare-Object $once $sonra) { Compare-Object $once $sonra | Out-Host; throw '/BILESENLERISAKLA ile kaldırmada indirilen bileşenler değişti/silindi' }
          foreach ($k in @('voices\seslerim\kisisel.txt','outputs\uretim.wav')) { if (-not (Test-Path (Join-Path $app $k))) { throw "Kullanıcı verisi silindi: $k" } }

          # 2) Aynı yere yeniden kurulum: bileşenler olduğu gibi kullanılır (işaret aynı → bat kurulumu atlar).
          Kur 'sakla-2'
          $sonra = Ortam-Izi
          if (Compare-Object $once $sonra) { Compare-Object $once $sonra | Out-Host; throw 'Yeniden kurulum saklanan bileşenleri değiştirdi' }
          $wv = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') |
                ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\SesVer.lnk'))
          Write-Host "Yeniden kurulum sonrası kısayol: $($t.TargetPath) $($t.Arguments) (WebView2: $(if ($wv) { $wv } else { 'YOK' }))"
          if ($wv -and $t.TargetPath -ne "$app\python-embed\pythonw.exe") { throw "Saklanan ortamla kısayol doğrudan pythonw.exe olmalı: $($t.TargetPath)" }

          # 3) Parametresiz sessiz kaldırma: eski davranış, indirilen bileşenler silinir.
          $kl = Kaldir 'varsayilan' @()
          if (-not (Select-String -Path $kl -Pattern 'Kaldirma: indirilen bilesenler siliniyor' -Quiet)) { throw 'Kaldırma günlüğünde "siliniyor" kararı yok' }
          for ($i = 0; $i -lt 30 -and ((Test-Path $pe) -or (Test-Path $venv)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $pe) { throw 'Varsayılan sessiz kaldırmada python-embed silinmedi' }
          if (Test-Path $venv) { throw 'Varsayılan sessiz kaldırmada .venv silinmedi' }
          foreach ($k in @('voices\seslerim\kisisel.txt','outputs\uretim.wav')) { if (-not (Test-Path (Join-Path $app $k))) { throw "Kullanıcı verisi silindi: $k" } }
          $global:LASTEXITCODE = 0
          Write-Host 'Kaldırma testi BAŞARILI: /BILESENLERISAKLA ile python-embed ve .venv bayt bayt aynı kaldı, aynı yere yeniden kurulum onları değiştirmeden kullandı, parametresiz sessiz kaldırma onları sildi; kullanıcı verisi her durumda korundu.'

      # Siberguvenlik 1.2.1 şartı: sihirbazın hata yolu gerçekten koşulur. İlk kurulum hata verince
      # kurulum_log_paylas.txt oluşmalı ve ev klasörü yolu içermemeli; "Açılışta güncellemeleri
      # denetle" kapalı kurulumda ayarlar.json'da güncelleme denetimi kapalı olmalı ve sonraki
      # parametresiz kurulum bu seçimi ezmemeli. Bir denetim tutmazsa adım (ve CI) düşer.
      - name: Hata yolu testi — paylaşılabilir günlük maskeli, güncelleme seçeneği ayarlar.json'a yansır
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SesVer'
          $ayar = Join-Path $app 'ayarlar.json'
          $ham = Join-Path $app 'kurulum_log.txt'
          $paylas = Join-Path $app 'kurulum_log_paylas.txt'
          New-Item -ItemType Directory -Force $app | Out-Null
          Remove-Item $ham, $paylas, (Join-Path $app 'kurulum_durum.txt') -Force -ErrorAction SilentlyContinue
          # Kullanıcının daha önce kaydettiği başka bir ayar (uygulamanın yazdığı biçimde) korunmalı.
          [IO.File]::WriteAllText($ayar, "{`n  `"arayuz_dili`": `"en`"`n}`n", [Text.UTF8Encoding]::new($false))

          # İlk kurulumu kesin ve hızlı düşürmek için pip'e ulaşılamayan bir paket dizini verilir:
          # Python normal indirilir (curl), pip 'voxcpm kurulumu' adımında hata verir.
          $env:PIP_INDEX_URL = 'http://127.0.0.1:9/simple'; $env:PIP_RETRIES = '0'; $env:PIP_TIMEOUT = '5'
          $log = Join-Path $env:RUNNER_TEMP 'sesver-kurulum-hata.log'
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ORTAMKUR','/GUNCELLEMEDENETIMI=0',"/LOG=$log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(20 * 60 * 1000)) { & taskkill.exe /T /F /PID $p.Id | Out-Host; throw 'Hata yolu kurulumu 20 dk içinde bitmedi' }
          Remove-Item Env:PIP_INDEX_URL, Env:PIP_RETRIES, Env:PIP_TIMEOUT
          $son = (Get-Content (Join-Path $app 'kurulum_durum.txt') -TotalCount 1 -ErrorAction SilentlyContinue)
          Write-Host "Kurulum çıkış kodu: $($p.ExitCode); son durum satırı: $son"
          if ($p.ExitCode -ne 30) { Get-Content $ham -Tail 40 -ErrorAction SilentlyContinue | Out-Host; throw "Beklenen çıkış kodu 30 (ilk kurulum tamamlanamadı): $($p.ExitCode)" }
          if ($son -notmatch '^\d/6\|hata:') { throw "Son durum satırı hata değil: '$son'" }

          # Paylaşılabilir kopya: var, ev klasörü yolu/kısa adı/kullanıcı adı yok, teknik içerik duruyor.
          if (-not (Test-Path $paylas)) { throw 'kurulum_log_paylas.txt oluşmadı' }
          $hamMetin = [IO.File]::ReadAllText($ham, [Text.Encoding]::UTF8)
          $payMetin = [IO.File]::ReadAllText($paylas, [Text.Encoding]::UTF8)
          $ev = $env:USERPROFILE.TrimEnd('\')
          $kisa = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($ev).ShortPath
          # Test anlamlı olsun: ham günlükte ev klasörü yolu gerçekten var (bat kurulum klasörünü yazar).
          if ($hamMetin.IndexOf($ev, [StringComparison]::OrdinalIgnoreCase) -lt 0) { throw 'Ham kurulum_log.txt ev klasörü yolunu içermiyor; denetim anlamsız kalır' }
          foreach ($iz in @($ev, $ev.Replace('\', '/'), $kisa, "\Users\$env:USERNAME", $env:USERNAME)) {
            if ($iz -and $payMetin.IndexOf($iz, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "kurulum_log_paylas.txt maskesiz iz içeriyor: $iz" }
          }
          $maske = ([regex]::Matches($payMetin, '<ev>')).Count
          if ($maske -lt 1) { throw 'kurulum_log_paylas.txt içinde <ev> maskesi yok' }
          foreach ($m in @('[DURUM] ', 'hata:')) { if (-not $payMetin.Contains($m)) { throw "Paylaşılabilir kopyada teknik satır yok: $m" } }
          Write-Host "----- kurulum_log_paylas.txt (son 15 satır; <ev> maskesi $maske kez) -----"
          ($payMetin -split "`r?`n") | Select-Object -Last 15 | ForEach-Object { Write-Host "  | $_" }

          # Güncelleme seçeneği kapalı kuruldu → ayarlar.json'da kapalı, diğer ayar korunmuş.
          $a = Get-Content $ayar -Raw -Encoding utf8 | ConvertFrom-Json
          Write-Host "ayarlar.json: $((Get-Content $ayar -Raw -Encoding utf8) -replace '\s+', ' ')"
          if ($a.guncelleme_kontrolu -isnot [bool] -or $a.guncelleme_kontrolu) { throw "ayarlar.json guncelleme_kontrolu false olmalı: '$($a.guncelleme_kontrolu)'" }
          if ($a.arayuz_dili -ne 'en') { throw "ayarlar.json'daki diğer ayar korunmadı: arayuz_dili='$($a.arayuz_dili)'" }

          # Parametresiz sessiz yeniden kurulum (güncelleme benzeri) kullanıcının seçimini ezmemeli.
          $once = (Get-FileHash $ayar).Hash
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$(Join-Path $env:RUNNER_TEMP 'sesver-kurulum-hata2.log')" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Parametresiz yeniden kurulum çıkış kodu: $($p.ExitCode)" }
          if ((Get-FileHash $ayar).Hash -ne $once) { throw 'Parametresiz yeniden kurulum ayarlar.json''u değiştirdi (önceki seçim ezildi)' }
          # Açıkça /GUNCELLEMEDENETIMI=1 verilirse yeniden açılır.
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/GUNCELLEMEDENETIMI=1',"/LOG=$(Join-Path $env:RUNNER_TEMP 'sesver-kurulum-hata3.log')" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "/GUNCELLEMEDENETIMI=1 kurulumu çıkış kodu: $($p.ExitCode)" }
          $a = Get-Content $ayar -Raw -Encoding utf8 | ConvertFrom-Json
          if ($a.guncelleme_kontrolu -isnot [bool] -or -not $a.guncelleme_kontrolu) { throw "ayarlar.json guncelleme_kontrolu true olmalı: '$($a.guncelleme_kontrolu)'" }
          if ($a.arayuz_dili -ne 'en') { throw 'ayarlar.json''daki diğer ayar ikinci yazımda korunmadı' }
          $global:LASTEXITCODE = 0
          Write-Host 'Hata yolu testi BAŞARILI: ilk kurulum hatası (çıkış kodu 30) kurulum_log_paylas.txt üretti, ev klasörü yolu ve kullanıcı adı içermiyor; /GUNCELLEMEDENETIMI=0 ayarlar.json guncelleme_kontrolu=false yazdı, diğer ayar korundu, parametresiz yeniden kurulum seçimi ezmedi.'

      - name: Kurulum günlükleri
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter 'sesver-kurulum*.log' | ForEach-Object { Write-Host "===== $($_.Name)"; Get-Content $_.FullName -Tail 60 }

      - name: Release dosyalarını hazırla (iki asset + SHA256 + notlar)
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          $ver = $env:APP_VERSION
          $surumlu = "windows\Output\SesVer-Kurulum-$ver.exe"
          $sabit = 'windows\Output\SesVer-Kurulum-Windows.exe'
          Copy-Item $surumlu $sabit -Force
          $h1 = (Get-FileHash -Algorithm SHA256 $surumlu).Hash.ToLowerInvariant()
          $h2 = (Get-FileHash -Algorithm SHA256 $sabit).Hash.ToLowerInvariant()
          if ($h1 -ne $h2) { throw "Sabit adlı kopyanın SHA256'sı farklı: $h1 / $h2" }
          $notlar = @(
            "## SesVer ${ver}: Windows kurulum programı",
            '',
            "1. **SesVer-Kurulum-Windows.exe** dosyasını indirin (aynı dosya: SesVer-Kurulum-$ver.exe).",
            '2. Çift tıklayın. "Windows bilgisayarınızı korudu" çıkarsa **Ek bilgi → Yine de çalıştır** (kurulum programı kod imzasızdır).',
            '3. **İleri** ile ilerleyin. **Gizlilik ve güncelleme denetimi** sayfası SesVer''in internete ne zaman bağlandığını özetler; **Açılışta güncellemeleri denetle** seçeneğini isterseniz kapatın, sonra **Kur**. Ardından "SesVer hazırlanıyor" sayfası Python ve paketleri indirir: 5–30 dk sürebilir, yaklaşık 3 GB iner, internet ve en az 20 GB boş alan gerekir. Ayrı bir siyah pencere açılmaz.',
            '4. **Bitir** ("SesVer''i şimdi aç" işaretli kalsın). Bir sorun olursa son sayfadaki **Günlüğü aç** düğmesi kurulum_log_paylas.txt dosyasını açar; bu dosyayı hermes.agent.hamarat@gmail.com adresine gönderebilirsiniz (ev klasörü yollarınız bu kopyada gizlidir).',
            '',
            'Sonra açmak için: Başlat menüsünde **SesVer** yazın ya da masaüstündeki SesVer simgesine çift tıklayın.',
            'Kaldırmak için: Ayarlar → Uygulamalar → SesVer (Seslerim ve outputs klasörü korunur).',
            '',
            '### SHA256',
            '',
            '```',
            "$h1  SesVer-Kurulum-$ver.exe",
            "$h2  SesVer-Kurulum-Windows.exe",
            '```',
            '',
            "Her zaman en son sürüm: https://github.com/$env:REPO/releases/latest/download/SesVer-Kurulum-Windows.exe",
            '',
            "Code signing policy (imza politikası) ve gizlilik politikası: https://github.com/$env:REPO#code-signing-policy"
          )
          [IO.File]::WriteAllLines((Join-Path $PWD 'windows\Output\RELEASE_NOTES.md'), $notlar, [Text.UTF8Encoding]::new($false))
          Get-ChildItem windows\Output | Format-Table Name, Length -AutoSize | Out-Host

      - name: Release dry-run (tag dışı koşu — yayınlanmaz)
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          $ver = $env:APP_VERSION
          Write-Host "dry-run: bu koşu ($env:EVENT, ref '$env:REF_NAME') bir tag değil; GitHub Release OLUŞTURULMADI."
          Write-Host "dry-run: tag v$ver push edilseydi release job'u şu komutla yayınlardı:"
          Write-Host "dry-run:   gh release create v$ver SesVer-Kurulum-$ver.exe SesVer-Kurulum-Windows.exe --title 'SesVer $ver' --notes-file RELEASE_NOTES.md --verify-tag --latest"
          foreach ($a in @("SesVer-Kurulum-$ver.exe", 'SesVer-Kurulum-Windows.exe')) {
            $f = Get-Item "windows\Output\$a"
            Write-Host ("dry-run: asset {0} ({1:N0} bayt) sha256={2}" -f $f.Name, $f.Length, (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant())
          }
          Write-Host 'dry-run: ----- release notları -----'
          Get-Content 'windows\Output\RELEASE_NOTES.md' -Encoding utf8 | ForEach-Object { Write-Host "dry-run: | $_" }

      - name: Artifact yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SesVer-Kurulum-${{ env.APP_VERSION }}
          path: |
            windows/Output/SesVer-Kurulum-*.exe
            windows/Output/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  # Yalnız v* tag push'unda ve build (derleme + duman testi) geçtiyse çalışır.
  # Yazma yetkisi yalnız bu job'a verilir; derleme/test job'u contents: read kalır.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Build artifact'ını indir
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: SesVer-Kurulum-${{ needs.build.outputs.version }}
          path: dist

      - name: GitHub Release yayınla (gh release)
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -la
          for f in "SesVer-Kurulum-${VER}.exe" SesVer-Kurulum-Windows.exe RELEASE_NOTES.md; do
            test -s "$f" || { echo "::error::Eksik release dosyası: $f"; exit 1; }
          done
          sha256sum SesVer-Kurulum-*.exe
          h=$(sha256sum "SesVer-Kurulum-${VER}.exe" | cut -d' ' -f1)
          grep -q "$h" RELEASE_NOTES.md || { echo "::error::Release notlarındaki SHA256 dosyayla tutmuyor"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG zaten var: asset'ler ve notlar güncelleniyor."
            gh release upload "$TAG" "SesVer-Kurulum-${VER}.exe" SesVer-Kurulum-Windows.exe --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "SesVer-Kurulum-${VER}.exe" SesVer-Kurulum-Windows.exe \
              --repo "$GITHUB_REPOSITORY" --title "SesVer ${VER}" --notes-file RELEASE_NOTES.md --verify-tag --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'

  # İsteğe bağlı (workflow_dispatch, full_launch_test=true): kurulum sihirbazının
  # ilk kurulum akışı gerçekten koşulur — sessiz /ORTAMKUR (torch vb. indirme, konsol
  # penceresi gözlemi) → durum/günlük/işaret/kısayol denetimi → kısayoldan açılış
  # (127.0.0.1 HTTP 200). Tag akışında çalışmaz.
  full-launch:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.full_launch_test
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Build artifact'ını indir
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: SesVer-Kurulum-${{ needs.build.outputs.version }}
          path: dist

      - name: Sihirbaz ilk kurulumu (/VERYSILENT /ORTAMKUR) ve kısayoldan tam açılış
        shell: pwsh
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SesVer'
          $durum = Join-Path $app 'kurulum_durum.txt'
          $ykLog = Join-Path $app 'kurulum_log.txt'
          $sh = New-Object -ComObject WScript.Shell
          $baslat = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\SesVer.lnk'
          $masa = Join-Path ([Environment]::GetFolderPath('Desktop')) 'SesVer.lnk'

          # Görünür konsol pencereleri (klasik conhost ve Windows Terminal sınıfları).
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class SvPencere {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static List<string> Konsollar() {
              var r = new List<string>();
              EnumWindows((h, l) => {
                if (!IsWindowVisible(h)) return true;
                var c = new StringBuilder(256); GetClassName(h, c, 256);
                var k = c.ToString();
                if (k == "ConsoleWindowClass" || k == "CASCADIA_HOSTING_WINDOW_CLASS") {
                  var t = new StringBuilder(512); GetWindowText(h, t, 512);
                  uint pid; GetWindowThreadProcessId(h, out pid);
                  r.Add(h.ToInt64().ToString("X") + " " + k + " pid=" + pid + " '" + t + "'");
                }
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          '@

          # Teşhis: ilk kurulum askıda kalırsa süreç ağacı, kurulum_* dosyaları ve
          # kurulum_log.txt (yazılırken de: FileShare.ReadWrite) basılır, kanıta kopyalanır.
          function Show-OrtamTeshis([string]$etiket) {
            Write-Host "----- [$etiket] TEŞHİS: ilgili süreçler -----"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(cmd|powershell|pwsh|conhost|OpenConsole|python|pythonw|pip|curl|tar|SesVer-Kurulum.*)\.(exe|tmp)$' } |
              Sort-Object CreationDate | ForEach-Object { Write-Host ("  pid={0} ppid={1} {2} {3:HH:mm:ss} {4}" -f $_.ProcessId, $_.ParentProcessId, $_.Name, $_.CreationDate, $_.CommandLine) }
            Write-Host "----- [$etiket] TEŞHİS: $app\kurulum_* -----"
            Get-ChildItem $app -Filter 'kurulum_*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  {0} {1} bayt {2:HH:mm:ss}" -f $_.Name, $_.Length, $_.LastWriteTime) }
            foreach ($f in @($ykLog, (Join-Path $app 'kurulum_pid.txt'), $durum)) {
              if (-not (Test-Path $f)) { Write-Host "  (yok) $f"; continue }
              try {
                $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
                $sr = New-Object System.IO.StreamReader($fs); $icerik = $sr.ReadToEnd(); $sr.Close()
                Write-Host "----- [$etiket] TEŞHİS: $f ($($icerik.Length) karakter, son 40 satır) -----"
                ($icerik -split "`r?`n") | Select-Object -Last 40 | ForEach-Object { Write-Host "  | $_" }
                Set-Content -Path (Join-Path $env:RUNNER_TEMP ("sesver-teshis-$etiket-" + (Split-Path $f -Leaf) + ".log")) -Value $icerik
              } catch { Write-Host "  okunamadı: $f : $_" }
            }
          }

          # Sessiz /ORTAMKUR kurulumunu çalıştırır; sürerken durum dosyasını ve yeni açılan
          # görünür konsol pencerelerini 0,5 sn'de bir gözler. Döner: gözlenen durum satırları.
          # Bat ilk durum satırını ("0/6|Basliyor") saniyeler içinde yazar; 4 dk'da hiç durum
          # satırı yoksa başlatma askıdadır: teşhis basılır ve 90 dk beklenmeden düşülür.
          function Kur-OrtamKur([string]$etiket, [int]$dakika) {
            $kurLog = Join-Path $env:RUNNER_TEMP "sesver-kurulum-$etiket.log"
            $onceki = @([SvPencere]::Konsollar())
            Write-Host "[$etiket] kurulumdan önce görünür konsol pencereleri: $($onceki.Count)"; $onceki | ForEach-Object { Write-Host "  $_" }
            $bas = Get-Date
            $kp = Start-Process -FilePath "dist\SesVer-Kurulum-$env:VER.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/ORTAMKUR', "/LOG=$kurLog" -PassThru
            $gorulen = @(); $yeni = @(); $sonRapor = Get-Date
            while (-not $kp.HasExited) {
              Start-Sleep -Milliseconds 500
              $s = Get-Content $durum -TotalCount 1 -ErrorAction SilentlyContinue
              if ($s -and ($gorulen.Count -eq 0 -or $gorulen[-1] -ne $s)) { $gorulen += $s; Write-Host ("[{0}] {1:mm\:ss} durum: {2}" -f $etiket, ((Get-Date) - $bas), $s) }
              foreach ($w in [SvPencere]::Konsollar()) {
                if ($onceki -notcontains $w -and $yeni -notcontains $w) { $yeni += $w; Write-Host "::warning::[$etiket] kurulum sırasında görünür konsol penceresi: $w" }
              }
              if (((Get-Date) - $sonRapor).TotalMinutes -ge 5) { $sonRapor = Get-Date; Get-Content $ykLog -Tail 3 -ErrorAction SilentlyContinue | Out-Host }
              if ($gorulen.Count -eq 0 -and ((Get-Date) - $bas).TotalMinutes -ge 4) { Show-OrtamTeshis $etiket; & taskkill.exe /T /F /PID $kp.Id | Out-Host; throw "[$etiket] 4 dk içinde hiç durum satırı yok: ilk kurulum başlatılamadı/askıda (teşhis yukarıda)" }
              if (((Get-Date) - $bas).TotalMinutes -ge $dakika) { Show-OrtamTeshis $etiket; & taskkill.exe /T /F /PID $kp.Id | Out-Host; throw "[$etiket] $dakika dk içinde sessiz /ORTAMKUR kurulumu bitmedi" }
            }
            $kp.WaitForExit()
            Write-Host ("[{0}] kurulum çıkış kodu {1}, süre {2:hh\:mm\:ss}" -f $etiket, $kp.ExitCode, ((Get-Date) - $bas))
            Copy-Item $ykLog (Join-Path $env:RUNNER_TEMP "sesver-kurulum_log-$etiket.log") -ErrorAction SilentlyContinue
            Write-Host "----- [$etiket] kurulum_log.txt (son 30 satır) -----"; Get-Content $ykLog -Tail 30 -ErrorAction SilentlyContinue | Out-Host
            if ($kp.ExitCode -ne 0) { throw "[$etiket] sessiz /ORTAMKUR kurulumu çıkış kodu $($kp.ExitCode) (30 = ilk kurulum tamamlanamadı)" }
            $son = (Get-Content $durum -TotalCount 1).Trim()
            if ($son -ne '6/6|tamam') { throw "[$etiket] durum dosyası '6/6|tamam' değil: '$son'" }
            foreach ($g in $gorulen) { if ($g -notmatch '^\d+/6\|[\x20-\x7e]+$') { throw "[$etiket] biçim dışı durum satırı: '$g'" } }
            if (-not (Test-Path $ykLog)) { throw "[$etiket] kurulum_log.txt yok" }
            if (-not (Test-Path (Join-Path $app 'python-embed\sesver_kurulum_tamam.txt'))) { throw "[$etiket] kurulum tamam işareti yok" }
            # Sihirbaz kodu (yalnız bat değil) son satırı okudu mu: Inno günlüğündeki iz.
            if (-not (Select-String -Path $kurLog -Pattern 'kurulum durumu: 6/6|tamam' -SimpleMatch -Quiet)) { throw "[$etiket] Inno günlüğünde '6/6|tamam' izi yok" }
            if ($yeni.Count) { throw "[$etiket] kurulum sırasında $($yeni.Count) görünür konsol penceresi açıldı" }
            Write-Host "[$etiket] görünür yeni konsol penceresi: 0 (0,5 sn örnekleme)"
            return ,$gorulen
          }

          function Test-Kisayollar([string]$etiket) {
            $wv = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                    'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                    'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') |
                  ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                  Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
            Write-Host "[$etiket] WebView2 Runtime: $(if ($wv) { $wv } else { 'YOK' })"
            foreach ($l in @($baslat, $masa)) {
              if (-not (Test-Path $l)) { throw "[$etiket] kısayol yok: $l" }
              $t = $sh.CreateShortcut($l)
              Write-Host "[$etiket] $l -> $($t.TargetPath) $($t.Arguments) [$($t.WorkingDirectory)]"
              if ($wv) {
                if ($t.TargetPath -ne "$app\python-embed\pythonw.exe") { throw "[$etiket] ilk kurulumdan sonra kısayol pythonw.exe olmalı: $($t.TargetPath)" }
                if ($t.Arguments -notlike '-E -s *desktop.py*') { throw "[$etiket] kısayol argümanı '-E -s ...desktop.py' olmalı: $($t.Arguments)" }
              } elseif ($t.TargetPath -ne "$app\WINDOWS_BASLAT.bat") { throw "[$etiket] WebView2 yokken kısayol .bat olmalı: $($t.TargetPath)" }
            }
          }

          function Test-Acilis([string]$etiket, [int]$dakika, [string]$outLog) {
            $t = $sh.CreateShortcut($baslat)
            Write-Host "[$etiket] kısayol: $($t.TargetPath) $($t.Arguments) [$($t.WorkingDirectory)] ikon=$($t.IconLocation)"
            $sp = @{ FilePath = $t.TargetPath; WorkingDirectory = $t.WorkingDirectory; PassThru = $true
                     RedirectStandardOutput = $outLog; RedirectStandardError = "$outLog.err" }
            if ($t.Arguments) { $sp.ArgumentList = $t.Arguments }
            # Önceki açılışın günlüğü eski bir adresi göstermesin (desktop.py her açılışta baştan yazar).
            Remove-Item (Join-Path $app 'sesver_log.txt') -Force -ErrorAction SilentlyContinue
            $null = Start-Process @sp
            $sinir = (Get-Date).AddMinutes($dakika); $sonRapor = Get-Date; $url = $null
            while ((Get-Date) -lt $sinir) {
              Start-Sleep -Seconds 10
              $slog = Join-Path $app 'sesver_log.txt'
              if (-not $url -and (Test-Path $slog)) {
                $m = Select-String -Path $slog -Pattern 'SesVer başlatılıyor \((http://127\.0\.0\.1:\d+)\)' -Encoding utf8 | Select-Object -First 1
                if ($m) { $url = $m.Matches[0].Groups[1].Value; Write-Host "[$etiket] sunucu adresi: $url" }
              }
              if ($url) {
                try {
                  $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 10
                  if ($r.StatusCode -eq 200) { Write-Host "[$etiket] HTTP $($r.StatusCode) $url ($($r.Content.Length) bayt)"; return $url }
                } catch { }
              }
              if (((Get-Date) - $sonRapor).TotalSeconds -ge 120) {
                $sonRapor = Get-Date
                Write-Host "[$etiket] bekleniyor... başlatıcı çıktısı son satırlar:"
                Get-Content $outLog -Tail 5 -ErrorAction SilentlyContinue | Out-Host
              }
            }
            Get-Content $outLog -Tail 60 -ErrorAction SilentlyContinue | Out-Host
            Get-Content (Join-Path $app 'sesver_log.txt') -Tail 60 -ErrorAction SilentlyContinue | Out-Host
            throw "[$etiket] $dakika dk içinde 127.0.0.1 HTTP 200 alınamadı"
          }

          function Save-Ekran([string]$ad) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $env:RUNNER_TEMP "$ad.png")); $g.Dispose(); $bmp.Dispose()
              Write-Host "Ekran görüntüsü: $ad.png"
            } catch { Write-Host "::warning::Ekran görüntüsü alınamadı: $_" }
          }

          function Stop-SesVer {
            Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($app, [StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" | Where-Object { $_.CommandLine -like '*WINDOWS_BASLAT.bat*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 5
          }

          # 1.4.1 ÖLÇÜM: kurulu ortamın üstüne yeniden kurulumda (aynı sürüm) ve "sakla" ile kaldırıp aynı
          # yere yeniden kurulumda paketler yeniden İNMEMELİ. Üç bağımsız kanıt, biri tutmazsa job düşer:
          #   1) kurulum_log.txt'de pip/Python indirme ya da kurulum satırı yok (Downloading, Collecting,
          #      Installing collected, "Indiriliyor: cpython", "Ilk kurulum yapiliyor", "esitleniyor");
          #   2) python-embed bayt toplamı (±50 MB) ve torch\__init__.py'nin yazılma zamanı değişmedi;
          #   3) ağ bağdaştırıcılarının aldığı bayt kurulum boyunca 500 MB'ı geçmedi (ilk kurulum ~3 GB).
          # Süre ve MB her koşuda ÖLÇÜM satırına yazılır.
          function Get-OrtamIzi {
            $pe = Join-Path $app 'python-embed'
            $dosyalar = @(Get-ChildItem $pe -Recurse -File -Force -ErrorAction SilentlyContinue)
            $torch = Join-Path $pe 'Lib\site-packages\torch\__init__.py'
            [pscustomobject]@{
              Isaret = (Get-Content (Join-Path $pe 'sesver_kurulum_tamam.txt') -Raw -ErrorAction SilentlyContinue)
              TorchZaman = if (Test-Path $torch) { (Get-Item $torch).LastWriteTimeUtc } else { $null }
              Sayi = $dosyalar.Count
              Bayt = [int64]($dosyalar | Measure-Object -Property Length -Sum).Sum
            }
          }
          function Get-AgBayt { [int64](Get-NetAdapterStatistics -ErrorAction SilentlyContinue | Measure-Object -Property ReceivedBytes -Sum).Sum }
          function Test-TekrarIndirmeYok([string]$etiket, $once, [int64]$rx0, [datetime]$bas) {
            $sure = [int]((Get-Date) - $bas).TotalSeconds
            $mb = [math]::Round(((Get-AgBayt) - $rx0) / 1MB, 1)
            $sonra = Get-OrtamIzi
            $satirlar = @(Select-String -Path $ykLog -Pattern '^\s*(Downloading|Collecting|Installing collected) |Indiriliyor: cpython|Ilk kurulum yapiliyor|esitleniyor' -ErrorAction SilentlyContinue)
            Write-Host ("[{0}] ÖLÇÜM: süre {1} sn; ağdan alınan {2} MB; python-embed {3} dosya / {4:N2} GB (önce {5} / {6:N2} GB); indirme/kurulum satırı {7}" -f $etiket, $sure, $mb, $sonra.Sayi, ($sonra.Bayt / 1GB), $once.Sayi, ($once.Bayt / 1GB), $satirlar.Count)
            if (-not $once.Isaret -or -not $once.TorchZaman) { throw "[$etiket] ölçüm anlamsız: ölçümden önce kurulu ortam (işaret + torch) yok" }
            if ($satirlar.Count) { $satirlar | Select-Object -First 15 | ForEach-Object { Write-Host "  | $($_.Line)" }; throw "[$etiket] kurulum günlüğünde indirme/kurulum satırı var: paketler yeniden indirildi ya da kuruldu" }
            if ($sonra.Isaret -ne $once.Isaret) { throw "[$etiket] kurulum işareti değişti: '$($once.Isaret)' -> '$($sonra.Isaret)'" }
            if ($sonra.TorchZaman -ne $once.TorchZaman) { throw "[$etiket] torch\__init__.py yeniden yazıldı ($($once.TorchZaman) -> $($sonra.TorchZaman))" }
            if ([math]::Abs($sonra.Bayt - $once.Bayt) -gt 50MB) { throw "[$etiket] python-embed boyutu 50 MB'tan fazla değişti" }
            if ($mb -gt 500) { throw "[$etiket] kurulum sırasında ağdan $mb MB alındı (eşik 500 MB; ilk kurulum ~3 GB)" }
            Write-Host "[$etiket] yeniden indirme YOK: günlükte indirme/kurulum satırı yok, işaret ve torch dosyası aynı, ağ $mb MB, süre $sure sn."
          }

          # 1) Sihirbazın ilk kurulumu: sessiz /ORTAMKUR (python-embed + pip + torch + paketler).
          $ilkBas = Get-Date; $ilkRx = Get-AgBayt
          $g1 = Kur-OrtamKur 'ilk' 90
          Write-Host ("[ilk] ÖLÇÜM (karşılaştırma için): süre {0} sn; ağdan alınan {1} MB" -f [int]((Get-Date) - $ilkBas).TotalSeconds, [math]::Round(((Get-AgBayt) - $ilkRx) / 1MB, 1))
          Write-Host "Sihirbazın gözlediği durum satırları: $($g1 -join ' ; ')"
          # Kısa adımlar (CPU'da 3-4) 0,5 sn örneklemede kaçabilir; bat her durumu günlüğe de yazar.
          $gunlukDurum = @(Select-String -Path $ykLog -Pattern '^\[DURUM\] (\d+/6\|.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "kurulum_log.txt [DURUM] satırları: $($gunlukDurum -join ' ; ')"
          foreach ($a in 1..6) { if (-not ($gunlukDurum | Where-Object { $_ -like "$a/6|*" })) { throw "İlk kurulumda $a. adım günlükte yok" } }
          if ($gunlukDurum[-1] -ne '6/6|tamam') { throw "Günlükteki son durum '6/6|tamam' değil: $($gunlukDurum[-1])" }
          Test-Kisayollar 'ilk'

          # 2) Kısayoldan açılış (ortam hazır; pythonw, konsolsuz).
          $u1 = Test-Acilis 'ilk açılış' 15 (Join-Path $env:RUNNER_TEMP 'sesver-full-ilk.out.log')
          Start-Sleep -Seconds 15; Save-Ekran 'sesver-ilk-acilis'
          Write-Host '----- sesver_log.txt (ilk açılış, ilk 40 satır) -----'
          Get-Content (Join-Path $app 'sesver_log.txt') -TotalCount 40 -Encoding utf8 | Out-Host
          Stop-SesVer

          # 3) Güncelleme benzeri yeniden kurulum: ortam hazır → bat hızlıca "tamam" demeli, hiçbir şey inmemeli.
          $o3 = Get-OrtamIzi; $rx3 = Get-AgBayt; $bas3 = Get-Date
          $g2 = Kur-OrtamKur 'yeniden' 15
          Write-Host "Yeniden kurulum durum satırları: $($g2 -join ' ; ')"
          Test-TekrarIndirmeYok 'yeniden' $o3 $rx3 $bas3
          Test-Kisayollar 'yeniden'

          # 4) İkinci açılış: kullanıcının "tekrar açma" yolu — aynı Başlat Menüsü kısayolu.
          $env:SESVER_DURUM_DOSYASI = Join-Path $env:RUNNER_TEMP 'sesver_durum_ikinci.txt'
          $u2 = Test-Acilis 'ikinci açılış' 10 (Join-Path $env:RUNNER_TEMP 'sesver-full-ikinci.out.log')
          Start-Sleep -Seconds 15; Save-Ekran 'sesver-ikinci-acilis'
          $durumIkinci = Get-Content $env:SESVER_DURUM_DOSYASI -ErrorAction SilentlyContinue
          Write-Host "İkinci açılış desktop.py durumu: $(if ($durumIkinci) { $durumIkinci } else { '(yazılmadı)' })"
          Write-Host '----- sesver_log.txt (ikinci açılış, ilk 40 satır) -----'
          Get-Content (Join-Path $app 'sesver_log.txt') -TotalCount 40 -Encoding utf8 | Out-Host
          Stop-SesVer

          # 5) "Sakla" ile kaldır → aynı yere yeniden kur: ortam yeniden inmemeli, SesVer açılmalı.
          $unKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{12D750B7-D7C7-400A-A81A-2A083B04A266}_is1'
          $o5 = Get-OrtamIzi
          $kl = Join-Path $env:RUNNER_TEMP 'sesver-kaldir-sakla.log'
          $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/BILESENLERISAKLA', "/LOG=$kl" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Sakla ile kaldırma çıkış kodu: $($p.ExitCode)" }
          for ($i = 0; $i -lt 120 -and ((Test-Path (Join-Path $app 'app.py')) -or (Test-Path $unKey) -or -not (Select-String -Path $kl -Pattern 'Kaldirma: indirilen bilesenler' -Quiet -ErrorAction SilentlyContinue)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'app.py')) { throw 'Sakla ile kaldırmadan sonra app.py kaldı' }
          if (-not (Select-String -Path $kl -Pattern 'Kaldirma: indirilen bilesenler saklandi' -Quiet)) { throw 'Kaldırma günlüğünde "saklandi" kararı yok' }
          if (-not (Test-Path (Join-Path $app 'python-embed\sesver_kurulum_tamam.txt'))) { throw 'Sakla ile kaldırmada python-embed/işaret silindi' }
          Write-Host "Sakla ile kaldırma: python-embed kaldı ($([math]::Round($o5.Bayt / 1GB, 2)) GB)."
          $rx5 = Get-AgBayt; $bas5 = Get-Date
          $g5 = Kur-OrtamKur 'sakla-yeniden' 15
          Write-Host "Sakla sonrası yeniden kurulum durum satırları: $($g5 -join ' ; ')"
          Test-TekrarIndirmeYok 'sakla-yeniden' $o5 $rx5 $bas5
          Test-Kisayollar 'sakla-yeniden'
          $u5 = Test-Acilis 'sakla sonrası açılış' 10 (Join-Path $env:RUNNER_TEMP 'sesver-full-sakla.out.log')
          Stop-SesVer

          # 6) Parametresiz sessiz kaldırma: eski davranış, python-embed silinir.
          $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Varsayılan kaldırma çıkış kodu: $($p.ExitCode)" }
          for ($i = 0; $i -lt 300 -and ((Test-Path (Join-Path $app 'app.py')) -or (Test-Path (Join-Path $app 'python-embed'))); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'python-embed')) { throw 'Varsayılan sessiz kaldırmada python-embed silinmedi' }
          $global:LASTEXITCODE = 0
          Write-Host "Tam test BAŞARILI: sessiz /ORTAMKUR ilk kurulumu 6/6|tamam (görünür konsol penceresi yok), kısayollar pythonw, ilk açılış $u1 ve ikinci açılış $u2 HTTP 200; üstüne yeniden kurulumda ve sakla ile kaldırıp yeniden kurulumda paketler yeniden inmedi (açılış $u5 HTTP 200), varsayılan kaldırma python-embed'i sildi."

      - name: Tam açılış günlükleri ve ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sesver-full-launch-kanit
          path: |
            ${{ runner.temp }}/sesver-*.log
            ${{ runner.temp }}/sesver-*.err
            ${{ runner.temp }}/sesver-*.png
            ${{ runner.temp }}/sesver_durum_*.txt
          if-no-files-found: warn
          retention-days: 14

  # 1.4.2: mikrofonla kayıt, gerçek SesVer penceresinde (desktop.py: pywebview + Edge WebView2).
  # Gerçek mikrofon yok: WebView2 sahte ses cihazı ve otomatik izinle başlatılır
  # (WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS); tools/mikrofon_duman.py CDP ile iki alanı dener:
  # Ses Oluştur → Dosya yükle (Kaydet → ~9,5 sn → Durdur; kayıt dosya yüklemeyle aynı hazırlıktan
  # geçmeli: WAV satırı, ileti yok) ve Ses Klonlama → Referans ses (mikrofon simgesi → Kaydet → Durdur;
  # kayıt yerel sunucuya yüklenmeli ve indirilen WAV 1–30 sn olmalı).
  # Ortam, kullanıcının bilgisayarındakiyle AYNI yoldan kurulur: WINDOWS_BASLAT.bat /yalniz-kurulum
  # (sihirbazın /ORTAMKUR'da çağırdığı kip): SHA-256 doğrulamalı python-embed 3.11, ardından
  # kilit\pip.txt, torch, voxcpm (üçü --no-deps) ve temel kilit; sıra ve bayraklar yalnız bat'ta
  # tanımlıdır, burada kopyası yoktur (kopya 1.4.2'nin ilk CI koşusunda --no-deps eksikliğiyle
  # düştü). Kurulum programından ve build job'undan bağımsızdır (needs yok). Başarısızlık
  # workflow'u kırmızı yapar; release job'u yalnız build'i bekler, yayın akışı ve var olan
  # adımlar değişmez.
  mikrofon-duman:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SesVer ortamını kur (WINDOWS_BASLAT.bat /yalniz-kurulum, kullanıcıyla aynı yol)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Paket listesi, sırası ve pip bayrakları burada YAZILMAZ: bat'ın kendisi çalışır (ilk
          # kurulum: python-embed → pip → GPU yoksa torch-pypi → voxcpm → temel kilit). Çıktının
          # tamamı kurulum_log.txt'ye, son durum kurulum_durum.txt'ye yazılır (sihirbazla aynı).
          $bas = Get-Date
          $yk = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" `
                  -ArgumentList '/d', '/c', 'call', "`"$PWD\WINDOWS_BASLAT.bat`"", '/yalniz-kurulum' `
                  -WorkingDirectory $PWD -WindowStyle Hidden -PassThru
          $null = $yk.Handle  # ExitCode, WaitForExit(süre) sonrası da okunabilsin
          $bitti = $yk.WaitForExit(45 * 60 * 1000)
          if (-not $bitti) { & taskkill.exe /T /F /PID $yk.Id | Out-Host }
          $kod = if ($bitti) { $yk.ExitCode } else { 124 }
          Write-Host ("Yalnız kurulum çıkış kodu {0}, süre {1:hh\:mm\:ss}" -f $kod, ((Get-Date) - $bas))
          Copy-Item 'kurulum_log.txt' (Join-Path $env:RUNNER_TEMP 'sesver-mikrofon-kurulum_log.txt') -ErrorAction SilentlyContinue
          Write-Host '----- kurulum_log.txt (son 40 satır) -----'
          Get-Content 'kurulum_log.txt' -Tail 40 -Encoding utf8 -ErrorAction SilentlyContinue | Out-Host
          $durum = Get-Content 'kurulum_durum.txt' -TotalCount 1 -ErrorAction SilentlyContinue
          Write-Host "kurulum_durum.txt: $durum"
          if (-not $bitti) { throw 'WINDOWS_BASLAT.bat /yalniz-kurulum 45 dk içinde bitmedi' }
          if ($kod -ne 0 -or $durum -notlike '*|tamam') { throw "WINDOWS_BASLAT.bat /yalniz-kurulum başarısız (çıkış $kod, durum '$durum')" }
          if (-not (Test-Path 'python-embed\sesver_kurulum_tamam.txt')) { throw 'Kurulum tamam işareti (python-embed\sesver_kurulum_tamam.txt) yok' }
          # Duman testinin gerçekten kullandığı paketler kurulu mu (desktop.py → app.py, pencere,
          # WebView2 köprüsü, yazıya dökme, model paketleri)? Yalnız find_spec: içe aktarma yan etkisi yok.
          & (Join-Path $PWD 'python-embed\python.exe') -E -s tools\mikrofon_duman.py --paket-denetimi
          if ($LASTEXITCODE -ne 0) { throw "Duman testinin gerektirdiği paketler eksik (çıkış $LASTEXITCODE)" }

      - name: Mikrofon kaydı duman testi (WebView2 sahte cihaz, tools/mikrofon_duman.py)
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222 --use-fake-device-for-media-stream --use-fake-ui-for-media-stream
          SESVER_GUNCELLEME_KONTROLU: "0"
          GRADIO_SERVER_PORT: "7860"
        run: |
          $ErrorActionPreference = 'Stop'
          # Önceki adımın kurduğu python-embed; SesVer kısayoluyla aynı açılış (pythonw.exe -E -s desktop.py).
          $py = Join-Path $PWD 'python-embed\python.exe'
          $pyw = Join-Path $PWD 'python-embed\pythonw.exe'
          $out = Join-Path $env:RUNNER_TEMP 'sesver-mikrofon.out.log'
          $sv = Start-Process -FilePath $pyw -ArgumentList '-E', '-s', 'desktop.py' -WorkingDirectory $PWD -PassThru `
                  -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          $kod = 99
          try {
            & $py -E -s tools\mikrofon_duman.py --cdp http://127.0.0.1:9222 --bekle 300 |
              Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'sesver-mikrofon-sonuc.json')
            $kod = $LASTEXITCODE
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $env:RUNNER_TEMP 'sesver-mikrofon.png')); $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "::warning::Ekran görüntüsü alınamadı: $_" }
          } finally {
            Stop-Process -Id $sv.Id -Force -ErrorAction SilentlyContinue
            Write-Host '----- sesver_log.txt (son 60 satır) -----'
            Get-Content 'sesver_log.txt' -Tail 60 -Encoding utf8 -ErrorAction SilentlyContinue | Out-Host
            Copy-Item 'sesver_log.txt' (Join-Path $env:RUNNER_TEMP 'sesver-mikrofon-sesver_log.txt') -ErrorAction SilentlyContinue
          }
          if ($kod -ne 0) { throw "Mikrofon duman testi başarısız (çıkış kodu $kod; 1 = Ses Oluştur ya da Ses Klonlama kaydı geçmedi, 2 = SesVer penceresi/sekmesi yok)" }
          $global:LASTEXITCODE = 0
          Write-Host 'Mikrofon duman testi BAŞARILI: SesVer penceresinde (WebView2) Kaydet → Durdur; Ses Oluştur kaydı dosya yüklemeyle aynı hazırlıktan geçti, Ses Klonlama referans kaydı 1–30 sn WAV olarak yüklendi.'

      - name: Mikrofon duman testi kanıtı
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sesver-mikrofon-duman
          path: |
            ${{ runner.temp }}/sesver-mikrofon*
          if-no-files-found: warn
          retention-days: 14
